<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My certificates | Jaouad El Ghouzi</title>
<style>
:root {
            --bg-color: #f6f8fb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #4f46e5;
            --accent-secondary: #0891b2;
            --accent-tertiary: #e11d48;
            --border-color: #e2e8f0;
            --shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
        }
[data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent-primary: #818cf8;
            --accent-secondary: #22d3ee;
            --accent-tertiary: #fb7185;
            --border-color: #334155;
            --shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        }
*{box-sizing:border-box}body{margin:0;background:var(--bg-color);color:var(--text-main);font:16px/1.55 "Segoe UI",Arial,sans-serif}.shell{max-width:1150px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:42px}a,button{font:inherit}button,.back{border:1px solid var(--border-color);border-radius:10px;padding:12px 18px;background:var(--card-bg);color:var(--text-main);cursor:pointer;text-decoration:none;font-weight:700}button:hover,.back:hover{border-color:var(--accent-primary)}:focus-visible{outline:3px solid var(--accent-secondary);outline-offset:3px}.eyebrow{color:var(--accent-secondary);text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800}h1{font-size:clamp(30px,5vw,44px);line-height:1.2;margin:12px 0}p{color:var(--text-muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:28px}.card{padding:24px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;box-shadow:var(--shadow)}.card h2{font-size:20px;overflow-wrap:anywhere}.tag{font-size:12px;font-weight:800;color:var(--accent-secondary);letter-spacing:1px}.view{background:var(--accent-primary);color:var(--bg-color);width:100%;margin-top:16px}.empty{padding:32px;border:1px dashed var(--border-color);border-radius:14px;grid-column:1/-1}dialog{width:min(1100px,96vw);max-height:94vh;padding:0;border:1px solid var(--border-color);border-radius:16px;background:var(--bg-color);color:var(--text-main)}dialog::backdrop{background:rgba(2,6,23,.8)}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;background:var(--card-bg)}.viewer-head h2{font-size:18px;margin:0;overflow-wrap:anywhere}.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px}.toolbar[hidden]{display:none}.viewport{overflow:auto;max-height:65vh;padding:16px;text-align:center}.viewport canvas,.viewport img{display:block;max-width:100%;height:auto;margin:auto;background:white}.viewport img{user-select:none;-webkit-user-drag:none}#status{margin:0;padding:8px 20px;text-align:center}.print-note{display:none}button:disabled{opacity:.45;cursor:default}@media(max-width:600px){.shell{padding:20px 16px}.viewer-head{padding:12px}.toolbar button{padding:8px 12px}}@media print{body>*{display:none!important}body>.print-note{display:block!important}}
.card{display:flex;flex-direction:column;min-width:0}.card .view{margin-top:auto}.card h2{font-size:18px;margin-bottom:24px}.soon{color:var(--accent-secondary);font-weight:700;margin-top:auto}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
.certificate-navigation{border-bottom:1px solid var(--border-color);background:var(--card-bg)}.certificate-navigation span{min-width:145px;text-align:center;color:var(--text-muted)}@media(max-width:600px){.certificate-navigation{gap:8px}.certificate-navigation button{font-size:13px;padding:10px}.certificate-navigation span{order:3;width:100%}}

/* Keep the certificate grid compact and readable on phones. */
@media(max-width:560px){.shell{padding:20px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:12px}.card h2{font-size:14px;line-height:1.35;margin-bottom:18px}.tag{font-size:10px}.view{padding:9px 5px;font-size:12px}.certificate-navigation{display:grid;grid-template-columns:1fr auto 1fr;gap:5px;padding:8px}.certificate-navigation button{font-size:11px;padding:8px 4px}.certificate-navigation span{order:initial;min-width:0;width:auto;white-space:nowrap;font-size:11px}.viewport{padding:8px}}
@media(max-width:380px){.card{padding:10px}.card h2{font-size:12px}.certificate-navigation button,.certificate-navigation span{font-size:10px}}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{padding:9px}.card h2{font-size:12px;line-height:1.3;margin-bottom:12px}.tag{font-size:9px}.view{padding:7px 3px;font-size:10px}}
</style></head><body>
<main class="shell"><header><a href="index.html" class="back">← Back to résumé</a><button id="theme" type="button">Light / Dark mode</button></header>
<div class="eyebrow">Jaouad El Ghouzi · Credentials</div><h1>My certificates</h1><p>Professional certifications and academic diplomas. Select a document to view it.</p>
<div id="grid" class="grid"></div><noscript><p>Enable JavaScript to view the certificates.</p></noscript></main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-head"><h2 id="viewer-title">Document</h2><button id="close" type="button" aria-label="Close document">Close ✕</button></div>
<nav class="toolbar certificate-navigation" aria-label="Certificate navigation">
<button id="previous-certificate" type="button">← Previous certificate</button>
<span id="certificate-position" role="status" aria-live="polite"></span>
<button id="next-certificate" type="button">Next certificate →</button>
</nav>
<div class="toolbar" id="paging" hidden><button id="prev" type="button">← Previous</button><span id="page-info"></span><button id="next" type="button">Next →</button></div>
<p id="status" role="status" aria-live="polite"></p><div id="viewport" class="viewport"></div></dialog>
<p class="print-note">Certificate printing is not available on this page.</p>
<script>
window.CERTIFICATES = [
  {
    "title": "Cyber Security Master Diploma",
    "category": "Diploma",
    "soon": true
  },
  {
    "title": "Cyber Security Bachelor Diploma",
    "file": "Cyber%20Security%20Bachelor%20Diploma.pdf",
    "category": "Diploma"
  },
  {
    "title": "Certified Ethical Hacker (CEH)",
    "file": "Certified%20Ethical%20Hacker-EC%20Council-Certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "CISM",
    "file": "CISM-certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "SecurityX CE",
    "file": "CompTIA%20SecurityX%20ce%20certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "PenTest+",
    "file": "CompTIA%20PenTest%2B%20ce%20certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "ITIL-4",
    "file": "ITIL-4.pdf",
    "category": "Certification"
  },
  {
    "title": "CySA+",
    "file": "CompTIA%20CySA%2B%20ce%20certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "Security+ CE",
    "file": "CompTIA%20Security%2B%20ce%20certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "AWS Certified Solutions Architect – Associate",
    "file": "AWS%20Certified%20Solutions%20Architect%20-%20Associate.pdf",
    "category": "Certification"
  },
  {
    "title": "Network+",
    "file": "CompTIA%20Network%2B%20ce%20certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "Data+ CE",
    "file": "CompTIA%20Data%2B%20ce%20certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "Network+ CE",
    "file": "CompTIA%20Network%2B%20ce%20certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "A+ CE",
    "file": "CompTIA%20A%2B%20ce%20certificate.pdf",
    "category": "Certification"
  },
  {
    "title": "Linux LP1 Certificate",
    "file": "Linux%20LP1-Certificate.pdf",
    "category": "Certificate"
  },
  {
    "title": "ISO/IEC 27001 Lead Auditor",
    "file": "ISO-IEC%2027001-Lead%20Auditor.pdf",
    "category": "Certificate"
  },
  {
    "title": "Applying Assessment & Authorization (A&A) in the National Industrial Security Program (NISP)",
    "file": "Applying%20Assessment%20%26%20Authorization%20%28A%26A%29%20in%20the%20National%20Industrial%20Security%20Program%20%28NISP%29.pdf",
    "category": "Certificate"
  },
  {
    "title": "Cyber Security Awareness",
    "file": "Cyber%20Security%20Awerness.pdf",
    "category": "Certificate"
  },
  {
    "title": "Cybersecurity for Personnel",
    "file": "Cybersecurity%20for%20Personnel.pdf",
    "category": "Certificate"
  },
  {
    "title": "Introduction to DoD Zero Trust",
    "file": "Introduction%20to%20DOD%20Zero%20Trust.pdf",
    "category": "Certificate"
  },
  {
    "title": "Phishing and Social Engineering",
    "file": "Phishing%20and%20Social%20Engineering.pdf",
    "category": "Certificate"
  }
];

(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  try {
    root.dataset.theme = localStorage.getItem('resume_theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch { root.dataset.theme = 'light'; }
  $('theme').onclick = () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('resume_theme', root.dataset.theme); } catch {}
  };
  let sequence = 0, task = null, pdf = null, pageNumber = 1, busy = false;
  let pdfLibrary;
  let activeCertificate = -1;
  const browsableCertificates = [];
  function updateCertificateNavigation() {
    $('previous-certificate').disabled = activeCertificate <= 0;
    $('next-certificate').disabled = activeCertificate < 0 || activeCertificate >= browsableCertificates.length - 1;
    $('certificate-position').textContent = `Document ${activeCertificate + 1} of ${browsableCertificates.length}`;
  }
  function showCertificate(index) {
    if (index < 0 || index >= browsableCertificates.length) return;
    activeCertificate = index;
    updateCertificateNavigation();
    const entry = browsableCertificates[index];
    openDocument(entry.item, entry.url, entry.extension);
  }
  $('previous-certificate').onclick = () => showCertificate(activeCertificate - 1);
  $('next-certificate').onclick = () => showCertificate(activeCertificate + 1);
  // Pinned PDF.js module and matching worker; loaded only when a PDF is opened.
  async function getPdfLibrary() {
    if (!pdfLibrary) {
      pdfLibrary = import('https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.min.mjs')
        .then(lib => {
          lib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.worker.min.mjs';
          return lib;
        }).catch(error => { pdfLibrary = null; throw error; });
    }
    return pdfLibrary;
  }
  function cleanup() {
    sequence++;
    const previousTask = task;
    task = null; pdf = null; busy = false;
    if (previousTask) previousTask.destroy().catch(() => {});
    $('viewport').replaceChildren();
    $('paging').hidden = true;
    $('status').textContent = '';
  }
  $('close').onclick = () => $('viewer').close();
  $('viewer').addEventListener('close', cleanup);
  // Discourage casual saving only. This is not access control or DRM.
  $('viewport').addEventListener('contextmenu', event => event.preventDefault());
  $('viewport').addEventListener('dragstart', event => event.preventDefault());
  function controls() {
    $('prev').disabled = busy || pageNumber <= 1;
    $('next').disabled = busy || !pdf || pageNumber >= pdf.numPages;
    $('page-info').textContent = pdf ? `Page ${pageNumber} of ${pdf.numPages}` : '';
  }
  async function renderPage(token) {
    busy = true; controls();
    $('status').textContent = 'Loading page…';
    $('viewport').replaceChildren();
    try {
      const page = await pdf.getPage(pageNumber);
      if (token !== sequence) return;
      const unit = page.getViewport({ scale: 1 });
      const width = Math.min(1000, Math.max(240, $('viewport').clientWidth - 32));
      const viewport = page.getViewport({ scale: width / unit.width * Math.min(devicePixelRatio || 1, 2) });
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
      canvas.style.width = `${width}px`;
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', `${$('viewer-title').textContent}, page ${pageNumber}`);
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
      if (token !== sequence) return;
      $('viewport').replaceChildren(canvas);
      $('status').textContent = '';
    } catch (error) {
      if (token === sequence) $('status').textContent = 'This page could not be displayed. Close and reopen the document to retry.';
    } finally {
      if (token === sequence) { busy = false; controls(); }
    }
  }
  async function openDocument(item, url, extension) {
    cleanup(); const token = sequence;
    $('viewer-title').textContent = item.title;
    $('status').textContent = 'Loading document…';
    if (!$('viewer').open) {
      $('viewer').showModal();
      $('close').focus();
    }
    try {
      if (extension === 'pdf') {
        const lib = await getPdfLibrary();
        if (token !== sequence) return;
        task = lib.getDocument({ url: url.href, isEvalSupported: false });
        const document = await task.promise;
        if (token !== sequence) return;
        pdf = document; pageNumber = 1;
        $('paging').hidden = false;
        await renderPage(token);
      } else {
        const img = new Image();
        img.alt = item.title; img.draggable = false;
        img.onload = () => {
          if (token !== sequence) return;
          $('viewport').replaceChildren(img); $('status').textContent = '';
        };
        img.onerror = () => {
          if (token === sequence) $('status').textContent = 'This image could not be loaded. Please check its published file path.';
        };
        img.src = url.href;
      }
    } catch (error) {
      if (token === sequence) $('status').textContent = 'This PDF could not be opened. Check the published file path and your connection. Password-protected PDFs are not supported.';
    }
  }
  $('prev').onclick = () => { if (!busy && pdf && pageNumber > 1) { pageNumber--; renderPage(sequence); } };
  $('next').onclick = () => { if (!busy && pdf && pageNumber < pdf.numPages) { pageNumber++; renderPage(sequence); } };
  const entries = Array.isArray(window.CERTIFICATES) ? window.CERTIFICATES : [];
  let count = 0;
  for (const item of entries) {
    if (!item || typeof item.title !== 'string') continue;
    if (item.soon) {
      const card = document.createElement('article'); card.className = 'card';
      const type = document.createElement('span'); type.className = 'tag'; type.textContent = item.category || 'Certificate';
      const title = document.createElement('h2'); title.textContent = item.title;
      const status = document.createElement('span'); status.className = 'soon'; status.textContent = 'Soon';
      card.append(type, title, status); $('grid').append(card); count++;
      continue;
    }
    if (typeof item.file !== 'string') continue;
    let url;
    try { url = new URL(item.file, document.baseURI); } catch { continue; }
    const extension = url.pathname.split('.').pop().toLowerCase();
    if (!['http:', 'https:'].includes(url.protocol) || !['pdf','jpg','jpeg','png'].includes(extension)) continue;
    const card = document.createElement('article'); card.className = 'card';
    const type = document.createElement('span'); type.className = 'tag';
    type.textContent = item.category || 'Certificate';
    const title = document.createElement('h2'); title.textContent = item.title;
    const button = document.createElement('button'); button.type = 'button'; button.className = 'view';
    button.textContent = 'View document'; button.setAttribute('aria-label', `View ${item.title}`);
    const certificateIndex = browsableCertificates.length;
    browsableCertificates.push({ item, url, extension });
    button.onclick = () => showCertificate(certificateIndex);
    card.append(type, title, button); $('grid').append(card); count++;
  }
  if (!count) {
    const empty = document.createElement('p'); empty.className = 'empty';
    empty.textContent = 'Certificates and diplomas will appear here when they are added.';
    $('grid').append(empty);
  }
})();

</script></body></html>
