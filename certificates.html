<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My certificates | Jaouad El Ghouzi</title>
<style>
:root {
            --bg-color: #f6f8fb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #4f46e5;
            --accent-secondary: #0891b2;
            --accent-tertiary: #e11d48;
            --border-color: #e2e8f0;
            --shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
        }
[data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent-primary: #818cf8;
            --accent-secondary: #22d3ee;
            --accent-tertiary: #fb7185;
            --border-color: #334155;
            --shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        }
*{box-sizing:border-box}body{margin:0;background:var(--bg-color);color:var(--text-main);font:16px/1.55 "Segoe UI",Arial,sans-serif}.shell{max-width:1150px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:42px}a,button{font:inherit}button,.back{border:1px solid var(--border-color);border-radius:10px;padding:12px 18px;background:var(--card-bg);color:var(--text-main);cursor:pointer;text-decoration:none;font-weight:700}button:hover,.back:hover{border-color:var(--accent-primary)}:focus-visible{outline:3px solid var(--accent-secondary);outline-offset:3px}.eyebrow{color:var(--accent-secondary);text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800}h1{font-size:clamp(30px,5vw,44px);line-height:1.2;margin:12px 0}p{color:var(--text-muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:20px;margin-top:28px}.card{padding:24px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;box-shadow:var(--shadow)}.card h2{font-size:20px;overflow-wrap:anywhere}.tag{font-size:12px;font-weight:800;color:var(--accent-secondary);letter-spacing:1px}.view{background:var(--accent-primary);color:var(--bg-color);width:100%;margin-top:16px}.empty{padding:32px;border:1px dashed var(--border-color);border-radius:14px;grid-column:1/-1}dialog{width:min(1100px,96vw);max-height:94vh;padding:0;border:1px solid var(--border-color);border-radius:16px;background:var(--bg-color);color:var(--text-main)}dialog::backdrop{background:rgba(2,6,23,.8)}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;background:var(--card-bg)}.viewer-head h2{font-size:18px;margin:0;overflow-wrap:anywhere}.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px}.toolbar[hidden]{display:none}.viewport{overflow:auto;max-height:65vh;padding:16px;text-align:center}.viewport canvas,.viewport img{display:block;max-width:100%;height:auto;margin:auto;background:white}.viewport img{user-select:none;-webkit-user-drag:none}#status{margin:0;padding:8px 20px;text-align:center}.print-note{display:none}button:disabled{opacity:.45;cursor:default}@media(max-width:600px){.shell{padding:20px 16px}.viewer-head{padding:12px}.toolbar button{padding:8px 12px}}@media print{body>*{display:none!important}body>.print-note{display:block!important}}
</style></head><body>
<main class="shell"><header><a href="index.html" class="back">← Back to résumé</a><button id="theme" type="button">Light / Dark mode</button></header>
<div class="eyebrow">Jaouad El Ghouzi · Credentials</div><h1>My certificates</h1><p>Professional certifications and academic diplomas. Select a document to view it.</p>
<div id="grid" class="grid"></div><noscript><p>Enable JavaScript to view the certificates.</p></noscript></main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-head"><h2 id="viewer-title">Document</h2><button id="close" type="button" aria-label="Close document">Close ✕</button></div>
<div class="toolbar" id="paging" hidden><button id="prev" type="button">← Previous</button><span id="page-info"></span><button id="next" type="button">Next →</button></div>
<p id="status" role="status" aria-live="polite"></p><div id="viewport" class="viewport"></div></dialog>
<p class="print-note">Certificate printing is not available on this page.</p>
<script src="certificates-list.js"></script><script src="certificates.js"></script></body></html>
